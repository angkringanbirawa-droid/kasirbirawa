<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pengeluaran - BirawaPOS</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  /* PERBAIKAN: Padding atas dinamis mengikuti tinggi header aman status bar */
  padding: calc(65px + env(safe-area-inset-top, 24px)) 16px 20px 16px;
}

/* HEADER */
.header{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  background:#1b1b1b;
  padding: calc(15px + env(safe-area-inset-top, 24px)) 20px 15px 20px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #2a2a2a;
}

.menu-btn{
  font-size:28px;
  cursor:pointer;
}

.title{
  font-size:20px;
  font-weight:bold;
  color:#facc15;
  letter-spacing: 0.5px;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  height:100vh;
  background:#1c1c1c;
  position:fixed;
  top:0;
  left:-260px;
  padding-top: calc(20px + env(safe-area-inset-top, 24px));
  transition:0.3s;
  z-index:9999;
}

.sidebar.active{
  left:0;
}

.sidebar a{
  display:block;
  padding:18px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #2a2a2a;
  font-size: 15px;
}

.sidebar a:hover{
  background:#2a2a2a;
}

.overlay{
  position:fixed;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,.6);
  display:none;
  top:0;
  left:0;
  z-index:998;
}

.overlay.active{
  display:block;
}

/* CONTENT CONTAINER */
.container{
  max-width: 600px;
  margin: auto;
  padding-top: 10px;
}

.card{
  background:#1e1e1e;
  border-radius:18px;
  padding:20px;
  margin-bottom:25px;
  border:1px solid #2a2a2a;
}

.input{
  width:100%;
  padding:14px;
  border:1px solid transparent;
  border-radius:12px;
  background:#2a2a2a;
  color:white;
  margin-bottom:14px;
  outline:none;
  font-size:14px;
  transition: 0.2s;
}

.input:focus{
  border-color: #facc15;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#facc15;
  color:#111;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  transition: 0.2s;
}

.btn:active{
  transform: scale(0.98);
}

.section-title{
  font-size:15px;
  font-weight:bold;
  color:#aaa;
  margin-bottom:15px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* LIST ITEM EXPENSE ELEGAN */
.item{
  background:#1e1e1e;
  padding:15px 18px;
  border-radius:14px;
  margin-bottom:12px;
  border:1px solid #2a2a2a;
  border-left: 5px solid #ef4444; /* Penanda Visual Merah Pengeluaran */
}

.item-keperluan{
  font-size:15px;
  font-weight:bold;
  color: #fff;
}

.item-nominal{
  color:#ff5252;
  font-weight:bold;
  font-size: 16px;
  margin-top:4px;
}

.item-tanggal{
  color:#888;
  font-size:12px;
  margin-top:6px;
}

.empty{
  text-align:center;
  color:#666;
  margin-top:30px;
  font-size: 14px;
}

</style>
</head>
<body>

<div class="header">
  <div class="menu-btn" onclick="openSidebar()">☰</div>
  <div class="title">PENGELUARAN</div>
</div>

<div class="sidebar" id="sidebar">
  <a href="data.html">🏠 Dashboard</a>
  <a href="transaksi.html">💰 Transaksi</a>
  <a href="histori.html">🧾 Histori</a>
  <a href="pengeluaran.html">📉 Pengeluaran</a>
  <a href="input.html">🍜 Kelola Produk</a>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="container">

  <div class="card">
    <input
      type="number"
      id="jumlah"
      class="input"
      placeholder="Jumlah Pengeluaran (Rp)"
    >

    <input
      type="text"
      id="keperluan"
      class="input"
      placeholder="Keperluan / Keterangan"
    >

    <button
      class="btn"
      onclick="simpanPengeluaran()"
    >
      SIMPAN PENGELUARAN
    </button>
  </div>

  <div class="section-title">
    Histori Pengeluaran Hari Ini
  </div>

  <div id="listPengeluaran">
    <div class="empty">
      Loading data...
    </div>
  </div>

</div>

<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "login.html";
}
const URL = "https://script.google.com/macros/s/AKfycbxpzfOKXJkXqUJbz8b9WeJXJxti5CRSIslQVfVgXviPftSVap8mpqjfuTnZwuz-GOs/exec";

function openSidebar(){
  document.getElementById("sidebar").classList.add("active");
  document.getElementById("overlay").classList.add("active");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

async function simpanPengeluaran(){
  const jumlah = document.getElementById("jumlah").value;
  const keperluan = document.getElementById("keperluan").value;

  if(!jumlah || !keperluan){
    alert("Lengkapi data pengeluaran!");
    return;
  }

  try {
    const res = await fetch(`${URL}?action=addPengeluaran&jumlah=${jumlah}&keperluan=${encodeURIComponent(keperluan)}`);
    const result = await res.text();
    
    alert(result);

    document.getElementById("jumlah").value = "";
    document.getElementById("keperluan").value = "";

    loadPengeluaran();
  } catch (err) {
    console.log(err);
    alert("Gagal terhubung ke server.");
  }
}

async function loadPengeluaran(){
  try {
    const res = await fetch(`${URL}?action=getPengeluaran`);
    const data = await res.json();

    let html = "";

    data.reverse().forEach(item=>{
      html += `
        <div class="item">
          <div class="item-keperluan">${item.keperluan || item.keterangan || "Pengeluaran"}</div>
          <div class="item-nominal">- Rp ${Number(item.jumlah).toLocaleString("id-ID")}</div>
          <div class="item-tanggal">📅 ${formatTanggal(item.tanggal)}</div>
        </div>
      `;
    });

    if(data.length === 0){
      html = `<div class="empty">Belum ada catatan pengeluaran</div>`;
    }

    document.getElementById("listPengeluaran").innerHTML = html;
  } catch(err) {
    console.log(err);
    document.getElementById("listPengeluaran").innerHTML = `<div class="empty">Gagal memuat histori</div>`;
  }
}

function formatTanggal(tanggal){
  const d = new Date(tanggal);
  return d.toLocaleString("id-ID", {
    day:"2-digit",
    month:"long",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

loadPengeluaran();
</script>

</body>
</html>
