<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pengeluaran - BirawaPOS</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
    body { background:#111; color:white; padding: calc(75px + env(safe-area-inset-top, 24px)) 16px 20px 16px; }
    .header { position:fixed; top:0; left:0; width:100%; z-index:1000; background:#1b1b1b; padding: calc(15px + env(safe-area-inset-top, 24px)) 20px 15px 20px; display:flex; align-items:center; gap:15px; border-bottom:1px solid #2a2a2a; }
    .title { font-size:20px; font-weight:bold; color:#facc15; }
    .container { max-width:600px; margin:auto; }
    .card { background:#1e1e1e; border-radius:18px; padding:20px; margin-bottom:20px; border:1px solid #2a2a2a; }
    .input { width:100%; padding:14px; border:1px solid #333; border-radius:12px; background:#2a2a2a; color:white; margin-bottom:12px; outline:none; }
    .btn { width:100%; padding:15px; border:none; border-radius:12px; background:#facc15; color:#111; font-weight:bold; cursor:pointer; transition:0.2s; }
    .item { background:#1e1e1e; padding:15px; border-radius:14px; margin-bottom:10px; border:1px solid #2a2a2a; border-left:5px solid #ff5252; display:flex; justify-content:space-between; align-items:center; }
    .edit-btn { background:#444; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:12px; }
    .empty { text-align:center; color:#666; margin-top:30px; }
</style>
</head>
<body>

<div class="header">
    <div class="title">PENGELUARAN</div>
</div>

<div class="container">
    <div class="card">
        <input type="number" id="jumlah" class="input" placeholder="Jumlah (Rp)">
        <input type="text" id="keperluan" class="input" placeholder="Keterangan">
        <button class="btn" id="mainBtn" onclick="simpanPengeluaran()">SIMPAN PENGELUARAN</button>
    </div>

    <div id="listPengeluaran"></div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxpzfOKXJkXqUJbz8b9WeJXJxti5CRSIslQVfVgXviPftSVap8mpqjfuTnZwuz-GOs/exec";
let editIndex = null;

async function loadPengeluaran(){
    const res = await fetch(`${URL}?action=getPengeluaran`);
    const data = await res.json();
    let html = "";
    data.reverse().forEach((item, index) => {
        let realIndex = data.length - 1 - index;
        html += `
            <div class="item">
                <div>
                    <div style="font-weight:bold">${item.keperluan}</div>
                    <div style="color:#ff5252; font-weight:bold">Rp ${Number(item.jumlah).toLocaleString("id-ID")}</div>
                    <div style="font-size:11px; color:#888">${item.tanggal}</div>
                </div>
                <button class="edit-btn" onclick="isiEdit(${realIndex}, '${item.keperluan}', ${item.jumlah})">EDIT</button>
            </div>
        `;
    });
    document.getElementById("listPengeluaran").innerHTML = html || `<div class="empty">Belum ada data</div>`;
}

function isiEdit(index, keperluan, jumlah) {
    editIndex = index;
    document.getElementById("keperluan").value = keperluan;
    document.getElementById("jumlah").value = jumlah;
    const btn = document.getElementById("mainBtn");
    btn.innerText = "SIMPAN PERUBAHAN";
    btn.style.background = "#00e676";
    window.scrollTo({top: 0, behavior: 'smooth'});
}

async function simpanPengeluaran(){
    const jumlah = document.getElementById("jumlah").value;
    const keperluan = document.getElementById("keperluan").value;
    if(!jumlah || !keperluan) return alert("Isi data!");

    const action = editIndex !== null ? "editPengeluaran" : "addPengeluaran";
    const res = await fetch(`${URL}?action=${action}&jumlah=${jumlah}&keperluan=${encodeURIComponent(keperluan)}&index=${editIndex !== null ? editIndex : ''}`);
    
    alert(await res.text());
    editIndex = null;
    document.getElementById("jumlah").value = "";
    document.getElementById("keperluan").value = "";
    document.getElementById("mainBtn").innerText = "SIMPAN PENGELUARAN";
    document.getElementById("mainBtn").style.background = "#facc15";
    loadPengeluaran();
}

loadPengeluaran();
</script>
</body>
</html>
