<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Registrasi Pegawai - BirawaPOS</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#111;
      color:white;
      /* PERBAIKAN: Padding atas dinamis biar konten gak tenggelam di bawah header */
      padding: calc(70px + env(safe-area-inset-top, 24px)) 16px 20px 16px;
    }

    /* HEADER */
    .header{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background:#1b1b1b;
      padding: calc(15px + env(safe-area-inset-top, 24px)) 20px 15px 20px;
      display:flex;
      align-items:center;
      border-bottom:1px solid #2a2a2a;
    }

    .menu-btn{
      font-size:28px;
      cursor:pointer;
    }

    .title{
      color:#facc15;
      font-size:20px;
      font-weight:bold;
      margin-left:15px;
      letter-spacing: 0.5px;
    }

    /* SIDEBAR */
    .sidebar{
      width:270px;
      height:100vh;
      background:#1c1c1c;
      position:fixed;
      top:0;
      left:-270px;
      transition:0.3s;
      z-index:9999;
      overflow-y:auto;
      padding-top: calc(20px + env(safe-area-inset-top, 24px));
    }

    .sidebar.active{
      left:0;
    }

    /* PROFILE */
    .profile-box{
      padding:25px 20px;
      text-align:center;
      border-bottom:1px solid #2c2c2c;
    }

    .profile-img{
      width:80px;
      height:80px;
      border-radius:50%;
      border:3px solid #facc15;
      background:white;
      margin-bottom:12px;
    }

    .profile-name{
      font-size:17px;
      font-weight:bold;
      color:white;
    }

    .profile-role{
      font-size:12px;
      color:#facc15;
      background: rgba(250, 204, 21, 0.1);
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top:6px;
    }

    /* SIDEBAR MENU */
    .sidebar a{
      display:flex;
      align-items:center;
      gap:14px;
      padding:16px 20px;
      color:white;
      text-decoration:none;
      border-bottom:1px solid #2a2a2a;
      transition:0.2s;
      font-size: 15px;
    }

    .sidebar a:hover{
      background:#2d2d2d;
    }

    /* OVERLAY */
    .overlay{
      position:fixed;
      width:100%;
      height:100vh;
      background:rgba(0,0,0,0.6);
      top:0;
      left:0;
      display:none;
      z-index:998;
    }

    .overlay.active{
      display:block;
    }

    /* CONTENT */
    .container{
      max-width: 500px;
      margin: auto;
    }

    .card{
      background:#1e1e1e;
      border-radius:18px;
      padding:22px;
      border:1px solid #2a2a2a;
    }

    h2{
      color:#facc15;
      font-size:18px;
      font-weight:bold;
      margin-bottom:20px;
      text-align:center;
      letter-spacing: 0.5px;
    }

    .form-group{
      margin-bottom:16px;
    }

    label{
      display:block;
      font-size:13px;
      color:#aaa;
      margin-bottom:6px;
      font-weight: bold;
    }

    .input{
      width:100%;
      padding:14px;
      border:1px solid transparent;
      border-radius:12px;
      background:#2a2a2a;
      color:white;
      outline:none;
      font-size:14px;
      transition: 0.2s;
    }

    .input:focus{
      border-color: #facc15;
    }

    select.input{
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:#facc15;
      color:#111;
      font-weight:bold;
      font-size:15px;
      cursor:pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn:active{
      transform: scale(0.98);
    }
  </style>
</head>
