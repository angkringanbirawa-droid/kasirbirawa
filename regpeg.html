<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Pegawai - BirawaPOS</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#111;
      color:white;
      padding:20px;
    }

    /* MENU BUTTON */

    .menu-btn{
      position:fixed;
      top:15px;
      left:15px;
      width:45px;
      height:45px;
      background:#facc15;
      color:#111;
      border-radius:12px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:24px;
      font-weight:bold;
      z-index:9999;
      cursor:pointer;
    }

    /* SIDEBAR */

    .sidebar{
      position:fixed;
      top:0;
      left:-250px;
      width:220px;
      height:100vh;
      background:#1d1d1d;
      padding-top:70px;
      transition:0.3s;
      z-index:9998;
      border-right:1px solid #333;
    }

    .sidebar.active{
      left:0;
    }

    .sidebar a{
      display:block;
      padding:15px 20px;
      color:white;
      text-decoration:none;
      border-bottom:1px solid #2a2a2a;
    }

    .sidebar a:hover{
      background:#2b2b2b;
    }

    h2{
      text-align:center;
      color:#facc15;
      margin-bottom:20px;
      margin-top:10px;
    }

    /* FORM */

    .form{
      background:#1d1d1d;
      padding:15px;
      border-radius:14px;
      margin-bottom:20px;
      border:1px solid #333;
    }

    input{
      width:100%;
      padding:13px;
      margin-bottom:12px;
      border:none;
      border-radius:10px;
      background:#2b2b2b;
      color:white;
      outline:none;
    }

    button{
      width:100%;
      padding:13px;
      background:#facc15;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    /* LIST */

    .list{
      margin-top:20px;
    }

    .card{
      background:#1d1d1d;
      padding:15px;
      margin-bottom:12px;
      border-radius:12px;
      border:1px solid #333;
    }

    .name{
      font-size:18px;
      font-weight:bold;
      color:#facc15;
      margin-bottom:6px;
    }

    .status{
      font-size:13px;
      color:#bbb;
      line-height:1.6;
    }

    .empty{
      text-align:center;
      color:#777;
      margin-top:20px;
    }

  </style>

</head>
<body>

  <!-- MENU BUTTON -->

  <div class="menu-btn" onclick="toggleSidebar()">
    ☰
  </div>

  <!-- SIDEBAR -->

  <div class="sidebar" id="sidebar">

    <a href="data.html">
      🏠 Dashboard
    </a>

    <a href="produk.html">
      📦 Kelola Produk
    </a>

    <a href="absensi.html">
      🕒 Absensi
    </a>

    <a href="regpeg.html">
      👤 Registrasi Pegawai
    </a>

  </div>

  <h2>
    REGISTRASI PEGAWAI
  </h2>

  <!-- FORM -->

  <div class="form">

    <input
      type="text"
      id="nama"
      placeholder="Nama Lengkap"
    >

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="addPegawai()">
      TAMBAH PEGAWAI
    </button>

  </div>

  <!-- LIST PEGAWAI -->

  <div class="list" id="list">

    <div class="empty">
      Loading data pegawai...
    </div>

  </div>

<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "login.html";
}
const URL =
"https://script.google.com/macros/s/AKfycbzdiABCZIRA7mWd6zx1vSFmnFEK6vm4polW3-hzHlilfeagTnN8V7yf9UO-BdCOKDUb/exec";


// =====================
// SIDEBAR
// =====================

function toggleSidebar(){

  document
  .getElementById("sidebar")
  .classList.toggle("active");

}


// =====================
// TAMBAH PEGAWAI
// =====================

async function addPegawai(){

  const nama =
  document.getElementById("nama").value;

  const username =
  document.getElementById("username").value;

  const password =
  document.getElementById("password").value;

  if(!nama || !username || !password){

    alert("Isi semua data");

    return;

  }

  try{

    const res =
    await fetch(
      `${URL}?action=addEmployee&nama=${encodeURIComponent(nama)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
    );

    const text =
    await res.text();

    alert(text);

    loadPegawai();

    document.getElementById("nama").value = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

  }catch(err){

    alert("Server error");

    console.log(err);

  }

}


// =====================
// LOAD LIST PEGAWAI
// =====================

async function loadPegawai(){

  try{

    const res =
    await fetch(
      `${URL}?action=getUsers`
    );

    const data =
    await res.json();

    let html = "";

    if(data.length === 0){

      html = `
        <div class="empty">
          Belum ada pegawai
        </div>
      `;

    }else{

      data.reverse().forEach(u => {

        html += `

          <div class="card">

            <div class="name">
              ${u.nama}
            </div>

            <div class="status">
              👤 Username : ${u.username}
            </div>

            <div class="status">
              🛡️ Role : ${u.role}
            </div>

            <div class="status">
              ✅ Status : ${u.status}
            </div>

          </div>

        `;

      });

    }

    document
    .getElementById("list")
    .innerHTML = html;

  }catch(err){

    console.log(err);

    document
    .getElementById("list")
    .innerHTML = `
      <div class="empty">
        Gagal load data
      </div>
    `;

  }

}

loadPegawai();

</script>

</body>
</html>
