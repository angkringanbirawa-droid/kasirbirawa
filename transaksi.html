<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Transaksi - BirawaPOS</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
}

/* HEADER */
.header{
  background:#1b1b1b;
  padding: calc(18px + env(safe-area-inset-top, 24px)) 18px 18px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #2a2a2a;
}

.header-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.menu-btn{
  font-size:28px;
  cursor:pointer;
}

.title{
  color:#facc15;
  font-size:22px;
  font-weight:bold;
}

/* ORDER BUTTON */
.order-btn{
  position:relative;
  font-size:26px;
  cursor:pointer;
}

.order-badge{
  position:absolute;
  top:-6px;
  right:-8px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:11px;
  font-weight:bold;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  height:100vh;
  background:#1c1c1c;
  position:fixed;
  top:0;
  left:-260px;
  transition:0.3s;
  z-index:999;
  padding-top: env(safe-area-inset-top, 24px);
}

.sidebar.active{
  left:0;
}

.sidebar a{
  display:block;
  padding:18px 20px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #2a2a2a;
}

.sidebar a:hover{
  background:#2a2a2a;
}

/* OVERLAY */
.overlay{
  position:fixed;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.5);
  top:0;
  left:0;
  display:none;
  z-index:998;
}

.overlay.active{
  display:block;
}

/* CONTENT */
.container{
  padding:15px;
}

/* PRODUK */
.produk-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.produk-card{
  background:#1d1d1d;
  border:1px solid #2a2a2a;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.produk-img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.produk-info{
  padding:12px;
}

.produk-nama{
  color:#facc15;
  font-weight:bold;
  margin-bottom:6px;
  font-size:15px;
}

.produk-harga{
  font-weight:bold;
  margin-bottom:5px;
}

.produk-stok{
  font-size:12px;
  color:#888;
}

/* FLOAT CART */
.floating-cart{
  position:fixed;
  right:20px;
  bottom:20px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#facc15;
  color:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  cursor:pointer;
  z-index:999;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.cart-badge{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  width:24px;
  height:24px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:12px;
  font-weight:bold;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-content{
  width:90%;
  max-width:420px;
  background:#1d1d1d;
  border-radius:20px;
  padding:20px;
}

/* TITLE */
.modal-title{
  font-size:22px;
  color:#facc15;
  margin-bottom:20px;
  text-align:center;
}

/* CART */
.cart-list{
  max-height:300px;
  overflow:auto;
  margin-bottom:15px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#222;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.qty-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty-btn{
  width:28px;
  height:28px;
  border:none;
  border-radius:8px;
  background:#333;
  color:white;
  cursor:pointer;
}

.total{
  font-size:20px;
  font-weight:bold;
  color:#facc15;
  margin-bottom:15px;
}

.pay-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#facc15;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:10px;
}

.save-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#333;
  color:white;
  font-size:15px;
  cursor:pointer;
}

/* ORDER LIST */
.order-item{
  background:#222;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
}

.order-name{
  color:#facc15;
  font-weight:bold;
  margin-bottom:5px;
}

.order-total{
  font-size:13px;
  color:#aaa;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:20px;
}

.input-name{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2a2a2a;
  color:white;
  margin-bottom:15px;
  outline:none;
}

.method-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  margin-bottom:12px;
  background:#2a2a2a;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.struk-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.yes{
  background:#facc15;
  color:#111;
}

.no{
  background:#333;
  color:white;
}

.search-pesanan{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search-pesanan input{
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2a2a2a;
  color:white;
  outline:none;
}

.search-pesanan button{
  width:55px;
  border:none;
  border-radius:12px;
  background:#facc15;
  color:#111;
  font-size:20px;
  cursor:pointer;
}

/* FIXED LOADING FOR ANDROID WEBVIEW CHIP CONTAINER */
#loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(11, 11, 11, 0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999999 !important;
}

</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="menu-btn" onclick="openSidebar()">☰</div>
    <div class="title">TRANSAKSI</div>
  </div>

  <div class="order-btn" onclick="openPesanan()">
    📦
    <div class="order-badge" id="orderBadge">0</div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <a href="data.html">🏠 Dashboard</a>
   <a href="absensi.html">🕒 Absensi </a>
  <a href="transaksi.html">💰 Transaksi</a>
  <a href="histori.html">🧾 Histori</a>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="container">
  <div class="produk-grid" id="produkContainer">
    <div class="empty">Loading produk...</div>
  </div>
</div>

<div class="floating-cart" onclick="openCart()">
  🛒
  <div class="cart-badge" id="cartBadge">0</div>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-title">Keranjang</div>
    <div class="cart-list" id="cartList"></div>
    <div class="total" id="totalHarga">Total : Rp 0</div>
    <button class="pay-btn" onclick="openPayment()">BAYAR SEKARANG</button>
    <button class="save-btn" onclick="openSaveOrder()">SIMPAN PESANAN</button>
  </div>
</div>

<div class="modal" id="saveModal">
  <div class="modal-content">
    <div class="modal-title">Simpan Pesanan</div>
    <input type="text" id="namaPesanan" class="input-name" placeholder="Nama pelanggan / meja">
    <button class="pay-btn" onclick="simpanPesanan()">SIMPAN</button>
  </div>
</div>

<div class="modal" id="pesananModal">
  <div class="modal-content">
    <div class="modal-title">Daftar Pesanan</div>
    <div class="search-pesanan">
      <input type="text" id="searchPesanan" placeholder="Cari pesanan..." onkeyup="filterPesanan()">
      <button onclick="filterPesanan()">🔍</button>
    </div>
    <div id="pesananList"></div>
  </div>
</div>

<div class="modal" id="paymentModal">
  <div class="modal-content">
    <div class="modal-title">Pilih Pembayaran</div>
    <button class="method-btn" onclick="bayar('QRIS')">QRIS</button>
    <button class="method-btn" onclick="bayar('Cash')">CASH</button>
  </div>
</div>

<div class="modal" id="strukModal">
  <div class="modal-content">
    <div class="modal-title">Cetak Struk?</div>
    <button class="struk-btn yes" onclick="cetakStruk()">YA</button>
    <button class="struk-btn no" onclick="selesaiTransaksi()">TIDAK</button>
  </div>
</div>

<!-- ELEMENT LOADING GIF ANTI BUG ANDROID WEBVIEW -->
<div id="loading">
  <img src="https://i.gifer.com/ZZ5H.gif" style="width: 50px; height: 50px; filter: hue-rotate(10deg); vertical-align: middle;">
</div>


<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "login.html";
}

const PRODUCT_URL = "https://script.google.com/macros/s/AKfycbwN6qlNF9VBj7ysb79rVd_AkNSg2jYC22xYwGR6fxLNlur20cu1AYKtS8j0xQb4yNJX/exec";
const TRANSACTION_URL = "https://script.google.com/macros/s/AKfycbxpzfOKXJkXqUJbz8b9WeJXJxti5CRSIslQVfVgXviPftSVap8mpqjfuTnZwuz-GOs/exec";

// URL AKSI DATABASE BARU LU UNTUK PELANGGAN GANTUNG
const GANTUNG_URL = "https://script.google.com/macros/s/AKfycbwVm1aod-67Jt3xRuhXNsnmaYVWrEtGDtBcomZaAgMNGjs0ioRA-sB5PItkDheQkfU/exec";

let produkData = [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Sekarang savedOrders murni kita jadikan array data lokal penampung setelah fetch Sheets
let savedOrders = [];

// Fungsi Pengendali Loading Layar
function showLoading(){
  document.getElementById("loading").style.setProperty("display", "flex", "important");
}
function hideLoading(){
  document.getElementById("loading").style.setProperty("display", "none", "important");
}

function saveLocal(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

/* SIDEBAR */
function openSidebar(){
  document.getElementById("sidebar").classList.add("active");
  document.getElementById("overlay").classList.add("active");
}

function closeSidebar(){
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

/* LOAD PRODUK */
async function loadProduk(){
  try{
    const response = await fetch(`${PRODUCT_URL}?action=getProducts&t=${Date.now()}`);
    const data = await response.json();
    produkData = data;
    renderProduk(data);
  }catch(err){
    console.log(err);
    document.getElementById("produkContainer").innerHTML = `
      <div class="empty">Gagal load produk</div>
    `;
  }
}

function renderProduk(data){
  const container = document.getElementById("produkContainer");
  let html = "";
  if(!data || data.length === 0){
    container.innerHTML = `
      <div class="empty">Produk kosong</div>
    `;
    return;
  }
  data.forEach(item => {
    html += `
      <div class="produk-card" onclick='tambahCart("${item.nama_barang}", "${item.harga}")'>
        <img src="${item.url_foto}" class="produk-img" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
        <div class="produk-info">
          <div class="produk-nama">${item.nama_barang}</div>
          <div class="produk-harga">Rp ${Number(item.harga).toLocaleString("id-ID")}</div>
          <div class="produk-stok">Stok : ${item.stok}</div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

/* CART */
function tambahCart(nama,harga){
  const existing = cart.find(item => item.nama === nama);
  if(existing){
    existing.qty++;
  }else{
    cart.push({ nama, harga:Number(harga), qty:1 });
  }
  renderCart();
  saveLocal();
}

function renderCart(){
  const cartList = document.getElementById("cartList");
  let total = 0;
  let totalItem = 0;
  let html = "";
  cart.forEach((item,index)=>{
    const subtotal = item.harga * item.qty;
    total += subtotal;
    totalItem += item.qty;
    html += `
      <div class="cart-item">
        <div>
          <div>${item.nama}</div>
          <small>Rp ${subtotal.toLocaleString("id-ID")}</small>
        </div>
        <div class="qty-box">
          <button class="qty-btn" onclick="kurangQty(${index})">-</button>
          <div>${item.qty}</div>
          <button class="qty-btn" onclick="tambahQty(${index})">+</button>
        </div>
      </div>
    `;
  });
  if(cart.length === 0){
    html = `<div class="empty">Belum ada produk</div>`;
  }
  cartList.innerHTML = html;
  document.getElementById("cartBadge").innerText = totalItem;
  document.getElementById("totalHarga").innerText = "Total : Rp " + total.toLocaleString("id-ID");
}

function tambahQty(index){
  cart[index].qty++;
  renderCart();
  saveLocal();
}

function kurangQty(index){
  cart[index].qty--;
  if(cart[index].qty <= 0){
    cart.splice(index,1);
  }
  renderCart();
  saveLocal();
}

function openCart(){
  document.getElementById("cartModal").style.display = "flex";
}

function openPayment(){
  if(cart.length === 0){
    alert("Keranjang kosong");
    return;
  }
  document.getElementById("cartModal").style.display = "none";
  document.getElementById("paymentModal").style.display = "flex";
}

async function bayar(method){
  try{
    let total = 0;
    cart.forEach(item => { total += item.harga * item.qty; });
    showLoading();
    const response = await fetch(`${TRANSACTION_URL}?action=saveTransaction&method=${method}&total=${total}&items=${encodeURIComponent(JSON.stringify(cart))}`);
    const result = await response.text();
    hideLoading();
    console.log(result);
    document.getElementById("paymentModal").style.display = "none";
    document.getElementById("strukModal").style.display = "flex";
    cart = [];
    saveLocal();
    renderCart();
    loadProduk();
  }catch(err){
    hideLoading();
    alert("Gagal simpan transaksi");
    console.log(err);
  }
}

function cetakStruk(){
  window.print();
  selesaiTransaksi();
}

function selesaiTransaksi(){
  document.getElementById("strukModal").style.display = "none";
  cart = [];
  renderCart();
  saveLocal();
}

/* ======================================================== */
/* PERBAIKAN: MANAJEMEN DAFTAR BELUM BAYAR KE GOOGLE SHEETS  */
/* ======================================================== */

// 1. Ambil Data dari Google Sheets saat buka halaman/refresh
async function loadDaftarGantungFromServer() {
  try {
    const res = await fetch(`${GANTUNG_URL}?action=getPelangganGantung&t=${Date.now()}`);
    const data = await res.json();
    savedOrders = data; // Masukkan ke list lokal
    updateOrderBadge();
  } catch(err) {
    console.log("Gagal sinkronisasi data gantung:", err);
  }
}

function openSaveOrder(){
  if(cart.length === 0){
    alert("Keranjang kosong");
    return;
  }
  document.getElementById("saveModal").style.display = "flex";
}

// 2. Fungsi Kirim/Simpan Pesanan Belum Bayar Ke Google Sheets
async function simpanPesanan(){
  const nama = document.getElementById("namaPesanan").value;
  if(!nama){
    alert("Isi nama pelanggan / nomor meja");
    return;
  }

  // Hitung detail ringkasan kolom Sheets (Nama, Order, Harga, Total_harga)
  let total_harga = 0;
  let orderDetails = [];
  let hargaDetails = [];

  cart.forEach(item => {
    total_harga += (item.harga * item.qty);
    orderDetails.push(`${item.nama} (x${item.qty})`);
    hargaDetails.push(`Rp ${item.harga.toLocaleString("id-ID")}`);
  });

  const orderString = orderDetails.join(", ");
  const hargaString = hargaDetails.join(", ");

  showLoading();

  try {
    const apiCall = `${GANTUNG_URL}?action=simpanPelangganGantung&nama=${encodeURIComponent(nama)}&order=${encodeURIComponent(orderString)}&harga=${encodeURIComponent(hargaString)}&total_harga=${total_harga}`;
    const res = await fetch(apiCall);
    const text = await res.text();

    hideLoading();

    if(text.trim() === "BERHASIL_SIMPAN") {
      // Masukkan juga detail keranjang penuh ke localstorage cadangan biar data item tidak pecah waktu di-restore
      let backupData = JSON.parse(localStorage.getItem("backupItems")) || {};
      backupData[nama] = [...cart];
      localStorage.setItem("backupItems", JSON.stringify(backupData));

      cart = [];
      saveLocal();
      renderCart();
      
      document.getElementById("saveModal").style.display = "none";
      document.getElementById("cartModal").style.display = "none";
      document.getElementById("namaPesanan").value = "";
      
      alert("Pesanan berhasil dicatat di database!");
      await loadDaftarGantungFromServer(); // Tarik data ulang
    } else {
      alert("Gagal menyimpan ke spreadsheet server");
    }
  } catch (err) {
    hideLoading();
    console.error(err);
    alert("Terjadi gangguan koneksi internet!");
  }
}

function updateOrderBadge(){
  document.getElementById("orderBadge").innerText = savedOrders.length;
}

/* PESANAN MODAL VIEW */
function openPesanan(){
  document.getElementById("pesananModal").style.display = "flex";
  renderPesanan();
}

function filterPesanan(){
  const keyword = document.getElementById("searchPesanan").value.toLowerCase();
  const filtered = savedOrders.filter(order => order.nama.toLowerCase().includes(keyword));
  renderPesanan(filtered);
}

function renderPesanan(data = savedOrders){
  const container = document.getElementById("pesananList");
  let html = "";
  if(data.length === 0){
    html = `<div class="empty">Pesanan tidak ditemukan</div>`;
    container.innerHTML = html;
    return;
  }
  data.forEach((order)=>{
    html += `
      <div class="order-item">
        <div class="order-name">${order.nama}</div>
        <div style="font-size:13px; color:#facc15; margin: 3px 0;">Menu: ${order.order}</div>
        <div class="order-total">Total : Rp ${Number(order.total_harga).toLocaleString("id-ID")}</div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button onclick="loadPesanan(${order.rowNumber}, '${escape(order.nama)}')" style="flex:1; padding:12px; border:none; border-radius:12px; background:#facc15; color:#111; font-weight:bold; cursor:pointer;">Bayar</button>
          <button onclick="hapusPesanan(${order.rowNumber})" style="flex:1; padding:12px; border:none; border-radius:12px; background:#5a1d1d; color:white; font-weight:bold; cursor:pointer;">Hapus</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// 3. Fungsi memanggil kembali pesanan gantung untuk dibayar lunas
async function loadPesanan(rowNumber, escapedNama){
  const namaReal = unescape(escapedNama);
  showLoading();

  try {
    // Hapus barisnya dari Google Sheets terlebih dahulu karena statusnya ditarik kembali ke kasir
    const res = await fetch(`${GANTUNG_URL}?action=hapusPelangganGantung&rowNumber=${rowNumber}`);
    const text = await res.text();

    hideLoading();

    if(text.trim() === "BERHASIL_HAPUS") {
      // Ambil detail struk dari backup local agar objek item menu kembali utuh di keranjang kasir
      let backupData = JSON.parse(localStorage.getItem("backupItems")) || {};
      if(backupData[namaReal]) {
        cart = [...backupData[namaReal]];
        delete backupData[namaReal]; // Bersihkan file backup
        localStorage.setItem("backupItems", JSON.stringify(backupData));
      } else {
        // Fallback jika dibuka dari HP lain yang belum punya local-backup item objeknya
        cart = [{ nama: `Pesanan Gantung: ${namaReal}`, harga: 0, qty: 1 }];
      }

      saveLocal();
      renderCart();
      document.getElementById("pesananModal").style.display = "none";
      openCart();
      await loadDaftarGantungFromServer();
    } else {
      alert("Gagal mengambil pesanan, kemungkinan sudah dihapus/diubah");
    }
  } catch(err) {
    hideLoading();
    console.error(err);
    alert("Koneksi buruk, gagal menarik data!");
  }
}

// 4. Fungsi menghapus pesanan gantung
async function hapusPesanan(rowNumber){
  const yakin = confirm("Hapus pesanan ini dari database?");
  if(!yakin) return;

  showLoading();

  try {
    const res = await fetch(`${GANTUNG_URL}?action=hapusPelangganGantung&rowNumber=${rowNumber}`);
    const text = await res.text();

    hideLoading();

    if(text.trim() === "BERHASIL_HAPUS") {
      alert("Pesanan berhasil dihapus!");
      await loadDaftarGantungFromServer();
      renderPesanan();
    } else {
      alert("Gagal menghapus data dari spreadsheet");
    }
  } catch (err) {
    hideLoading();
    alert("Koneksi bermasalah!");
  }
}

// JALANKAN OTOMATIS SAAT HALAMAN DI-LOAD
loadProduk();
renderCart();
loadDaftarGantungFromServer();

document.querySelectorAll(".modal").forEach(modal => {
  modal.addEventListener("click", function(e){
    if(e.target === modal){
      modal.style.display = "none";
    }
