<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaksi - BirawaPOS</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
}

/* HEADER */

.header{
  background:#1b1b1b;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #2a2a2a;
}

.header-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.menu-btn{
  font-size:28px;
  cursor:pointer;
}

.title{
  color:#facc15;
  font-size:22px;
  font-weight:bold;
}

/* ORDER BUTTON */

.order-btn{
  position:relative;
  font-size:26px;
  cursor:pointer;
}

.order-badge{
  position:absolute;
  top:-6px;
  right:-8px;

  width:22px;
  height:22px;

  border-radius:50%;

  background:red;
  color:white;

  font-size:11px;
  font-weight:bold;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  height:100vh;
  background:#1c1c1c;
  position:fixed;
  top:0;
  left:-260px;
  transition:0.3s;
  z-index:999;
}

.sidebar.active{
  left:0;
}

.sidebar a{
  display:block;
  padding:18px 20px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #2a2a2a;
}

.sidebar a:hover{
  background:#2a2a2a;
}

/* OVERLAY */

.overlay{
  position:fixed;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.5);
  top:0;
  left:0;
  display:none;
  z-index:998;
}

.overlay.active{
  display:block;
}

/* CONTENT */

.container{
  padding:15px;
}

/* PRODUK */

.produk-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.produk-card{
  background:#1d1d1d;
  border:1px solid #2a2a2a;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.produk-img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.produk-info{
  padding:12px;
}

.produk-nama{
  color:#facc15;
  font-weight:bold;
  margin-bottom:6px;
  font-size:15px;
}

.produk-harga{
  font-weight:bold;
  margin-bottom:5px;
}

.produk-stok{
  font-size:12px;
  color:#888;
}

/* FLOAT CART */

.floating-cart{
  position:fixed;
  right:20px;
  bottom:20px;

  width:65px;
  height:65px;

  border-radius:50%;

  background:#facc15;
  color:#111;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:28px;
  cursor:pointer;

  z-index:999;

  box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.cart-badge{
  position:absolute;
  top:-5px;
  right:-5px;

  background:red;
  color:white;

  width:24px;
  height:24px;

  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:12px;
  font-weight:bold;
}

/* MODAL */

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-content{
  width:90%;
  max-width:420px;
  background:#1d1d1d;
  border-radius:20px;
  padding:20px;
}

/* TITLE */

.modal-title{
  font-size:22px;
  color:#facc15;
  margin-bottom:20px;
  text-align:center;
}

/* CART */

.cart-list{
  max-height:300px;
  overflow:auto;
  margin-bottom:15px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#222;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.qty-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty-btn{
  width:28px;
  height:28px;
  border:none;
  border-radius:8px;
  background:#333;
  color:white;
  cursor:pointer;
}

.total{
  font-size:20px;
  font-weight:bold;
  color:#facc15;
  margin-bottom:15px;
}

.pay-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#facc15;
  color:#111;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:10px;
}

.save-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#333;
  color:white;
  font-size:15px;
  cursor:pointer;
}

/* ORDER LIST */

.order-item{
  background:#222;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
}

.order-name{
  color:#facc15;
  font-weight:bold;
  margin-bottom:5px;
}

.order-total{
  font-size:13px;
  color:#aaa;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:20px;
}

.input-name{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2a2a2a;
  color:white;
  margin-bottom:15px;
  outline:none;
}

.method-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  margin-bottom:12px;
  background:#2a2a2a;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.struk-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

.yes{
  background:#facc15;
  color:#111;
}

.no{
  background:#333;
  color:white;
}

.search-pesanan{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search-pesanan input{
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2a2a2a;
  color:white;
  outline:none;
}

.search-pesanan button{
  width:55px;
  border:none;
  border-radius:12px;
  background:#facc15;
  color:#111;
  font-size:20px;
  cursor:pointer;
}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">

  <div class="header-left">

    <div 
      class="menu-btn"
      onclick="openSidebar()"
    >
      ☰
    </div>

    <div class="title">
      Transaksi
    </div>

  </div>

  <div 
    class="order-btn"
    onclick="openPesanan()"
  >

    📦

    <div class="order-badge" id="orderBadge">
      0
    </div>

  </div>

</div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

  <a href="data.html">🏠 Dashboard</a>
  <a href="absensi.html">🕒 Absensi</a>
  <a href="transaksi.html">💰 Transaksi</a>
  <a href="histori.html">🧾 Histori</a>
  <a href="#" onclick="logout()">🚪 Logout</a>

</div>

<div 
  class="overlay"
  id="overlay"
  onclick="closeSidebar()"
></div>

<!-- CONTENT -->

<div class="container">

  <div class="produk-grid" id="produkContainer">

    <div class="empty">
      Loading produk...
    </div>

  </div>

</div>

<!-- FLOAT CART -->

<div 
  class="floating-cart"
  onclick="openCart()"
>

  🛒

  <div class="cart-badge" id="cartBadge">
    0
  </div>

</div>

<!-- CART -->

<div class="modal" id="cartModal">

  <div class="modal-content">

    <div class="modal-title">
      Keranjang
    </div>

    <div class="cart-list" id="cartList"></div>

    <div class="total" id="totalHarga">
      Total : Rp 0
    </div>

    <button
      class="pay-btn"
      onclick="openPayment()"
    >
      BAYAR SEKARANG
    </button>

    <button
      class="save-btn"
      onclick="openSaveOrder()"
    >
      SIMPAN PESANAN
    </button>

  </div>

</div>

<!-- SAVE ORDER -->

<div class="modal" id="saveModal">

  <div class="modal-content">

    <div class="modal-title">
      Simpan Pesanan
    </div>

    <input
      type="text"
      id="namaPesanan"
      class="input-name"
      placeholder="Nama pelanggan / meja"
    >

    <button
      class="pay-btn"
      onclick="simpanPesanan()"
    >
      SIMPAN
    </button>

  </div>

</div>

<!-- PESANAN -->

<div class="modal" id="pesananModal">

  <div class="modal-content">

    <div class="modal-title">
      Daftar Pesanan
    </div>

    <div class="search-pesanan">

      <input
        type="text"
        id="searchPesanan"
        placeholder="Cari pesanan..."
        onkeyup="filterPesanan()"
      >

      <button onclick="filterPesanan()">
        🔍
      </button>

    </div>

    <div id="pesananList"></div>

  </div>

</div>

<!-- PAYMENT -->

<div class="modal" id="paymentModal">

  <div class="modal-content">

    <div class="modal-title">
      Pilih Pembayaran
    </div>

    <button
      class="method-btn"
      onclick="bayar('QRIS')"
    >
      QRIS
    </button>

    <button
      class="method-btn"
      onclick="bayar('Cash')"
    >
      CASH
    </button>

  </div>

</div>

<!-- STRUK -->

<div class="modal" id="strukModal">

  <div class="modal-content">

    <div class="modal-title">
      Cetak Struk?
    </div>

    <button
      class="struk-btn yes"
      onclick="cetakStruk()"
    >
      YA
    </button>

    <button
      class="struk-btn no"
      onclick="selesaiTransaksi()"
    >
      TIDAK
    </button>

  </div>

</div>


<script>
  if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "login.html";
}

const PRODUCT_URL =
"https://script.google.com/macros/s/AKfycbwN6qlNF9VBj7ysb79rVd_AkNSg2jYC22xYwGR6fxLNlur20cu1AYKtS8j0xQb4yNJX/exec";

const TRANSACTION_URL =
"https://script.google.com/macros/s/AKfycbxpzfOKXJkXqUJbz8b9WeJXJxti5CRSIslQVfVgXviPftSVap8mpqjfuTnZwuz-GOs/exec";

let produkData = [];

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let savedOrders =
JSON.parse(localStorage.getItem("savedOrders")) || [];

function saveLocal(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  localStorage.setItem(
    "savedOrders",
    JSON.stringify(savedOrders)
  );

}

/* SIDEBAR */

function openSidebar(){

  document
  .getElementById("sidebar")
  .classList.add("active");

  document
  .getElementById("overlay")
  .classList.add("active");

}

function closeSidebar(){

  document
  .getElementById("sidebar")
  .classList.remove("active");

  document
  .getElementById("overlay")
  .classList.remove("active");

}

/* LOAD PRODUK */

async function loadProduk(){

  try{

    const response =
    await fetch(
      `${PRODUCT_URL}?action=getProducts&t=${Date.now()}`
    );

    const data =
    await response.json();

    produkData = data;

    renderProduk(data);

  }catch(err){

    console.log(err);

    document
    .getElementById("produkContainer")
    .innerHTML =
    `
      <div class="empty">
        Gagal load produk
      </div>
    `;

  }

}

function renderProduk(data){

  const container =
  document.getElementById("produkContainer");

  let html = "";

  if(!data || data.length === 0){

    container.innerHTML =
    `
      <div class="empty">
        Produk kosong
      </div>
    `;

    return;

  }

  data.forEach(item => {

    html += `

      <div
        class="produk-card"
        onclick='tambahCart(
          "${item.nama_barang}",
          "${item.harga}"
        )'
      >

        <img
          src="${item.url_foto}"
          class="produk-img"
          onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"
        >

        <div class="produk-info">

          <div class="produk-nama">
            ${item.nama_barang}
          </div>

          <div class="produk-harga">
            Rp ${Number(item.harga).toLocaleString("id-ID")}
          </div>

          <div class="produk-stok">
            Stok : ${item.stok}
          </div>

        </div>

      </div>

    `;

  });

  container.innerHTML = html;

}

/* CART */

function tambahCart(nama,harga){

  const existing =
  cart.find(item =>
    item.nama === nama
  );

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      nama,
      harga:Number(harga),
      qty:1
    });

  }

  renderCart();

  saveLocal();

}

function renderCart(){

  const cartList =
  document.getElementById("cartList");

  let total = 0;
  let totalItem = 0;
  let html = "";

  cart.forEach((item,index)=>{

    const subtotal =
    item.harga * item.qty;

    total += subtotal;
    totalItem += item.qty;

    html += `

      <div class="cart-item">

        <div>

          <div>
            ${item.nama}
          </div>

          <small>
            Rp ${subtotal.toLocaleString("id-ID")}
          </small>

        </div>

        <div class="qty-box">

          <button
            class="qty-btn"
            onclick="kurangQty(${index})"
          >
            -
          </button>

          <div>
            ${item.qty}
          </div>

          <button
            class="qty-btn"
            onclick="tambahQty(${index})"
          >
            +
          </button>

        </div>

      </div>

    `;

  });

  if(cart.length === 0){

    html = `
      <div class="empty">
        Belum ada produk
      </div>
    `;

  }

  cartList.innerHTML = html;

  document
  .getElementById("cartBadge")
  .innerText = totalItem;

  document
  .getElementById("totalHarga")
  .innerText =
  "Total : Rp " +
  total.toLocaleString("id-ID");

}

function tambahQty(index){

  cart[index].qty++;

  renderCart();

  saveLocal();

}

function kurangQty(index){

  cart[index].qty--;

  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }

  renderCart();

  saveLocal();

}

function openCart(){

  document
  .getElementById("cartModal")
  .style.display = "flex";

}

function openPayment(){

  if(cart.length === 0){

    alert("Keranjang kosong");

    return;

  }

  document
  .getElementById("cartModal")
  .style.display = "none";

  document
  .getElementById("paymentModal")
  .style.display = "flex";

}

async function bayar(method){

  try{

    let total = 0;

    cart.forEach(item => {

      total +=
      item.harga * item.qty;

    });
    const response =
    await fetch(

      `${TRANSACTION_URL}?action=saveTransaction&method=${method}&total=${total}&items=${encodeURIComponent(JSON.stringify(cart))}`

    );

    const result =
    await response.text();

    console.log(result);

    document
    .getElementById("paymentModal")
    .style.display = "none";

    document
    .getElementById("strukModal")
    .style.display = "flex";

    cart = [];

    saveLocal();

    renderCart();

    loadProduk();

  }catch(err){

    alert("Gagal simpan transaksi");

    console.log(err);

  }

}

function cetakStruk(){

  window.print();

  selesaiTransaksi();

}

function selesaiTransaksi(){

  document
  .getElementById("strukModal")
  .style.display = "none";

  cart = [];

  renderCart();

  saveLocal();

}

/* SAVE ORDER */

function openSaveOrder(){

  if(cart.length === 0){

    alert("Keranjang kosong");

    return;

  }

  document
  .getElementById("saveModal")
  .style.display = "flex";

}

function simpanPesanan(){

  const nama =
  document
  .getElementById("namaPesanan")
  .value;

  if(!nama){

    alert("Isi nama pesanan");

    return;

  }

  /* simpan order */

  savedOrders.push({

    nama:nama,
    items:[...cart]

  });

  /* reset keranjang */

  cart = [];

  /* simpan local */

  saveLocal();

  /* update UI */

  renderCart();

  updateOrderBadge();

  /* tutup modal */

  document
  .getElementById("saveModal")
  .style.display = "none";

  document
  .getElementById("cartModal")
  .style.display = "none";

  /* reset input */

  document
  .getElementById("namaPesanan")
  .value = "";

  alert("Pesanan disimpan");

}

function updateOrderBadge(){

  document
  .getElementById("orderBadge")
  .innerText =
  savedOrders.length;

}

/* PESANAN */

function openPesanan(){

  document
  .getElementById("pesananModal")
  .style.display = "flex";

  renderPesanan();

}

function filterPesanan(){

  const keyword =
  document
  .getElementById("searchPesanan")
  .value
  .toLowerCase();

  const filtered =
  savedOrders.filter(order =>
    order.nama
    .toLowerCase()
    .includes(keyword)
  );

  renderPesanan(filtered);

}

function renderPesanan(data = savedOrders){

  const container =
  document.getElementById("pesananList");

  let html = "";

  if(data.length === 0){

    html = `
      <div class="empty">
        Pesanan tidak ditemukan
      </div>
    `;

    container.innerHTML = html;

    return;

  }

  data.forEach((order)=>{

    let total = 0;

    order.items.forEach(item=>{

      total +=
      item.harga * item.qty;

    });

    html += `

      <div class="order-item">

        <div class="order-name">
          ${order.nama}
        </div>

        <div class="order-total">
          Total :
          Rp ${total.toLocaleString("id-ID")}
        </div>

        <div style="
          display:flex;
          gap:10px;
          margin-top:15px;
        ">

          <button
            onclick="loadPesanan(${savedOrders.indexOf(order)})"
            style="
              flex:1;
              padding:12px;
              border:none;
              border-radius:12px;
              background:#facc15;
              color:#111;
              font-weight:bold;
              cursor:pointer;
            "
          >
            Bayar
          </button>

          <button
            onclick="hapusPesanan(${savedOrders.indexOf(order)})"
            style="
              flex:1;
              padding:12px;
              border:none;
              border-radius:12px;
              background:#5a1d1d;
              color:white;
              font-weight:bold;
              cursor:pointer;
            "
          >
            Hapus
          </button>

        </div>

      </div>

    `;

  });

  container.innerHTML = html;

}

function loadPesanan(index){

  cart = [...savedOrders[index].items];

  savedOrders.splice(index,1);

  updateOrderBadge();

  renderCart();

  renderPesanan();

  saveLocal();

  document
  .getElementById("pesananModal")
  .style.display = "none";

  openCart();

}

function hapusPesanan(index){

  const yakin =
  confirm("Hapus pesanan ini?");

  if(!yakin) return;

  savedOrders.splice(index,1);

  updateOrderBadge();

  renderPesanan();

  saveLocal();

}

loadProduk();

renderCart();

updateOrderBadge();

document.querySelectorAll(".modal").forEach(modal => {

  modal.addEventListener("click", function(e){

    if(e.target === modal){

      modal.style.display = "none";

    }

  });

});

</script>


</body>
</html>
