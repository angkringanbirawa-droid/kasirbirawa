<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Produk - BirawaPOS</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  padding:20px;
}

/* MENU BUTTON */

.menu-btn{
  position:fixed;
  top:15px;
  left:15px;
  width:45px;
  height:45px;
  background:#facc15;
  color:#111;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
  z-index:9999;
  cursor:pointer;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  top:0;
  left:-250px;
  width:220px;
  height:100vh;
  background:#1d1d1d;
  padding-top:70px;
  transition:0.3s;
  z-index:9998;
  border-right:1px solid #333;
}

.sidebar.active{
  left:0;
}

.sidebar a{
  display:block;
  padding:15px 20px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #2a2a2a;
}

.sidebar a:hover{
  background:#2b2b2b;
}

.container{
  max-width:550px;
  margin:auto;
  margin-top:40px;
}

.card{
  background:#1d1d1d;
  border:1px solid #2a2a2a;
  border-radius:20px;
  padding:20px;
}

h2{
  text-align:center;
  color:#facc15;
  margin-bottom:25px;
}

.menu{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.menu button{
  flex:1;
}

button{
  padding:14px;
  border:none;
  border-radius:12px;
  background:#facc15;
  color:#111;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:0.9;
}

input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2b2b2b;
  color:white;
  margin-bottom:12px;
  outline:none;
}

.hidden{
  display:none;
}

.info{
  margin-top:15px;
  text-align:center;
  color:#aaa;
}

.list{
  margin-top:20px;
}

.item{
  background:#2b2b2b;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
}

.nama{
  color:#facc15;
  font-size:18px;
  font-weight:bold;
}

.harga{
  margin-top:6px;
  color:#ccc;
}

.stok{
  margin-top:4px;
  color:#888;
}

.action{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.btn-edit{
  flex:1;
  background:#22c55e;
  color:white;
}

.btn-hapus{
  flex:1;
  background:#ef4444;
  color:white;
}

</style>
</head>
<body>

<!-- MENU BUTTON -->

<div class="menu-btn" onclick="toggleSidebar()">
  ☰
</div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

  <a href="data.html">
    🏠 Dashboard
  </a>

  <a href="produk.html">
    📦 Kelola Produk
  </a>

  <a href="absensi.html">
    🕒 Absensi
  </a>

  <a href="regpeg.html">
    👤 Registrasi Pegawai
  </a>

</div>

<div class="container">

  <div class="card">

    <h2>
      KELOLA PRODUK
    </h2>

    <!-- MENU -->

    <div class="menu">

      <button onclick="showTambah()">
        Tambah Produk
      </button>

      <button onclick="showEdit()">
        Edit Produk
      </button>

    </div>

    <!-- TAMBAH -->

    <div id="tambahPage">

      <input
        type="text"
        id="namaProduk"
        placeholder="Nama Produk"
      >

      <input
        type="number"
        id="hargaProduk"
        placeholder="Harga Produk"
      >

      <input
        type="number"
        id="stokProduk"
        placeholder="Stok Produk"
      >

      <button onclick="tambahProduk()">
        SIMPAN PRODUK
      </button>

      <div class="info" id="infoTambah"></div>

    </div>

    <!-- EDIT -->

    <div id="editPage" class="hidden">

      <div class="list" id="listProduk">

        <div class="info">
          Loading produk...
        </div>

      </div>

    </div>

  </div>

</div>

<script>

const URL =
"https://script.google.com/macros/s/AKfycbzdiABCZIRA7mWd6zx1vSFmnFEK6vm4polW3-hzHlilfeagTnN8V7yf9UO-BdCOKDUb/exec";


// =========================
// SIDEBAR
// =========================

function toggleSidebar(){

  document
  .getElementById("sidebar")
  .classList.toggle("active");

}


// =========================
// SHOW PAGE
// =========================

function showTambah(){

  document
  .getElementById("tambahPage")
  .classList.remove("hidden");

  document
  .getElementById("editPage")
  .classList.add("hidden");

}

function showEdit(){

  document
  .getElementById("editPage")
  .classList.remove("hidden");

  document
  .getElementById("tambahPage")
  .classList.add("hidden");

  loadProduk();

}


// =========================
// TAMBAH PRODUK
// =========================

async function tambahProduk(){

  const nama =
  document.getElementById("namaProduk").value;

  const harga =
  document.getElementById("hargaProduk").value;

  const stok =
  document.getElementById("stokProduk").value;

  if(!nama || !harga || !stok){

    alert("Lengkapi data");

    return;

  }

  try{

    const response =
    await fetch(
      `${URL}?action=addProduct&nama=${encodeURIComponent(nama)}&harga=${harga}&stok=${stok}`
    );

    const result =
    await response.text();

    document
    .getElementById("infoTambah")
    .innerText = result;

    document
    .getElementById("namaProduk").value = "";

    document
    .getElementById("hargaProduk").value = "";

    document
    .getElementById("stokProduk").value = "";

  }catch(error){

    document
    .getElementById("infoTambah")
    .innerText = "Server error";

  }

}


// =========================
// LOAD PRODUK
// =========================

async function loadProduk(){

  try{

    const response =
    await fetch(
      `${URL}?action=getProducts`
    );

    const data =
    await response.json();

    let html = "";

    if(data.length == 0){

      html = `
        <div class="info">
          Belum ada produk
        </div>
      `;

    }else{

      data.reverse().forEach(item => {

        html += `

          <div class="item">

            <div class="nama">
              ${item.nama}
            </div>

            <div class="harga">
              Harga : Rp ${Number(item.harga).toLocaleString("id-ID")}
            </div>

            <div class="stok">
              Stok : ${item.stok}
            </div>

            <div class="action">

              <button
                class="btn-edit"
                onclick="editProduk('${item.id}')"
              >
                Edit
              </button>

              <button
                class="btn-hapus"
                onclick="hapusProduk('${item.id}')"
              >
                Hapus
              </button>

            </div>

          </div>

        `;

      });

    }

    document
    .getElementById("listProduk")
    .innerHTML = html;

  }catch(error){

    document
    .getElementById("listProduk")
    .innerHTML =
    "Gagal load produk";

  }

}


// =========================
// EDIT PRODUK
// =========================

function editProduk(id){

  alert(
    "Fitur edit produk nanti kita lanjut 🔥\nID Produk : " + id
  );

}


// =========================
// HAPUS PRODUK
// =========================

function hapusProduk(id){

  alert(
    "Fitur hapus produk nanti kita lanjut 🔥\nID Produk : " + id
  );

}

</script>

</body>
</html>
